<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGRSI | ITI</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="tema.css">
    <link rel="stylesheet" href="componentes.css">
    <link rel="stylesheet" href="layout.css">
    <script src="navegacion.js" defer></script>
    <script src="autenticacion.js" defer></script>
    <script src="tema.js" defer></script>
</head>
<body>
    <button class="dark-btn" onclick="toggleDark()">◑</button>
    
    <div class="login-container">
        <div class="card">
            <h1>Iniciar Sesión</h1>
            <input type="email" id="correo" placeholder="Correo" required>
            <input type="password" id="clave" placeholder="Contraseña" required>
            <p id="errorLogin" style="color:red;"></p>
            <button onclick="login()">Ingresar</button>
            <p>¿No tienes cuenta? <a onclick="mostrarRegistro()">Regístrate</a></p>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio | SGRSI</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="tema.css">
    <link rel="stylesheet" href="componentes.css">
    <link rel="stylesheet" href="layout.css">
    <script src="navegacion.js" defer></script>
    <script src="autenticacion.js" defer></script>
    <script src="servicio.js" defer></script>
    <script src="tema.js" defer></script>
</head>
<body>
    <button class="dark-btn" onclick="toggleDark()">◑</button>

    <!-- Formulario (only admin and solicitante) -->
    <div id="formSolicitud" class="card" style="display:none; max-width:500px;">
        <h1>Solicitud de Servicio</h1>
        <input type="text" id="tipoServicio" placeholder="Tipo de servicio" required>
        <input type="text" id="descripcionServicio" placeholder="Descripción del servicio" required>
        <select id="prioridad" required>
            <option value="">Seleccione prioridad</option>
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
        </select>
        <p id="errorServicio" style="color:red;"></p>
        <button onclick="enviarSolicitud()">Enviar solicitud</button>
    </div>

    <!-- Tabla de solicitudes -->
    <div class="section-container" style="margin: 20px auto; max-width: 1200px;">
        <h1 style="margin-bottom: 15px;">Solicitudes de Servicio</h1>
        <div style="overflow-x: auto;">
            <table class="tabla-datos" id="tablaSolicitudes">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tipo</th>
                        <th>Descripción</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                        <th>Solicitante</th>
                        <th>Técnico</th>
                        <th>Fecha</th>
                        <th id="colAccionesSol" style="display:none;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="bodySolicitudes">
                    <tr><td colspan="9">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>

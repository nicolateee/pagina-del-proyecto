<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema | SGRSI</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="tema.css">
    <link rel="stylesheet" href="componentes.css">
    <link rel="stylesheet" href="layout.css">
    <script src="navegacion.js" defer></script>
    <script src="autenticacion.js" defer></script>
    <script src="tema.js" defer></script>
</head>
<body>
    <button class="dark-btn" onclick="toggleDark()">◑</button>

    <div class="card">
        <h1>Panel del Sistema</h1>
        <p id="rolInfo" style="font-size:14px; color:#666;"></p>
        <button onclick="mostrarInventario()">Inventario</button>
        <button onclick="mostrarIncidencias()">Incidencias</button>
        <button id="btnSolicitudes" onclick="mostrarServicio()" style="display:none;">Solicitud de servicio</button>
        <button id="btnAdminUsuarios" onclick="mostrarAdminUsuarios()" style="display:none;">Gestionar Usuarios</button>
        <button onclick="logout()">Cerrar sesión</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const usuario = await verificarSesion();
            if (!usuario) return;

            document.getElementById('rolInfo').textContent =
                `Sesión: ${usuario.nombre} (${usuario.rol})`;

            // Solicitudes: admin y solicitante pueden crear; tecnico puede ver asignadas
            if (['admin', 'solicitante', 'tecnico'].includes(usuario.rol)) {
                document.getElementById('btnSolicitudes').style.display = 'block';
            }

            // Admin users panel
            if (usuario.rol === 'admin') {
                document.getElementById('btnAdminUsuarios').style.display = 'block';
            }
        });
    </script>
</body>
</html>
